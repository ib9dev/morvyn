<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Todos os comandos do Morvyn, o bot de WhatsApp para grupos. Busque por nome ou categoria.">
<title>Comandos do Morvyn</title>
<style>
:root{--bg:#09090b;--p:#131316;--p2:#1b1a20;--bd:#27252e;--tx:#efedf4;--mu:#8e8a9c;--ac:#8b3fd1;--ac2:#b98af2;--acd:#2a1040}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
.mu{color:var(--mu)}
em{font-style:normal;color:var(--ac2)}
header{position:sticky;top:0;z-index:5;background:#09090bd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:650;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;min-height:46px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.pri{background:linear-gradient(135deg,#5a1f8f,#9a4de0);border-color:transparent;color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.topo{padding:48px 0 22px}
h1{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:800}
.topo p{color:var(--mu);margin-top:12px;max-width:560px;font-size:17px}
.tools{position:sticky;top:64px;z-index:4;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--bd)}
.busca{width:100%;font:inherit;color:var(--tx);background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;min-height:48px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font:inherit;font-size:14px;color:#cfcbdb;background:var(--p2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--acd);border-color:var(--ac);color:var(--ac2);font-weight:650}
.chips button small{color:var(--mu);margin-left:4px}
section{padding-top:34px}
h2{font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
h2 small{font-size:14px;color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:14px}
.cmd{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer}
.cmd:hover{border-color:var(--ac)}
code{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:2px 9px;font:15px ui-monospace,Menlo,monospace;color:var(--ac2)}
.cmd span{font-size:14px;color:var(--mu)}
.vazio{padding:60px 0;text-align:center;color:var(--mu)}
.fim{margin:60px 0 0;border-top:1px solid var(--bd);padding:36px 0 48px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);border-radius:12px;padding:11px 16px;font-size:14px;z-index:9;box-shadow:0 8px 28px #000a}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="w bar">
  <a class="brand" href="index.html">
    <img src="icon-192.png" width="32" height="32" alt="" style="border-radius:10px">
    Morvyn</a>
  <span class="sp"></span>
  <a class="btn pri" href="index.html#planos">Ver planos</a>
</div></header>

<main class="w">
  <div class="topo">
    <h1><em id="total">…</em> comandos para o seu grupo</h1>
    <p>Diversão, moderação, utilidades e mais. A lista é a mesma do bot e cresce a cada atualização. Toque em um comando para copiar.</p>
  </div>

  <div class="tools">
    <input class="busca" id="busca" type="search" placeholder="Buscar comando…" autocomplete="off" aria-label="Buscar comando">
    <div class="chips" id="chips"></div>
  </div>

  <div id="lista" aria-live="polite"></div>

  <div class="fim">
    <div><b>Gostou?</b><div class="mu">Peça um teste e veja o Morvyn funcionando no seu grupo.</div></div>
    <a class="btn pri" href="index.html#planos">Ver planos</a>
  </div>
</main>

<script>
const $ = id => document.getElementById(id)
const nomeCat = c => c === 'todas' ? 'Todas' : c.replace(/[-_]+/g, ' ').replace(/^./, m => m.toUpperCase())
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
let dados = null, cat = 'todas', q = ''

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }

function desenhar() {
  const { comandos, prefixo } = dados
  const cats = [...new Set(comandos.map(c => c.category))].sort((a, b) => a === 'outros' ? 1 : b === 'outros' ? -1 : a.localeCompare(b))
  const filtrados = comandos.filter(c => (cat === 'todas' || c.category === cat) && (!q || norm(c.name + ' ' + c.desc + ' ' + c.category).includes(q)))

  $('chips').replaceChildren(...['todas', ...cats].map(k => {
    const b = el('button', k === cat ? 'on' : '', nomeCat(k))
    b.append(el('small', '', String(k === 'todas' ? comandos.length : comandos.filter(c => c.category === k).length)))
    b.onclick = () => { cat = k; desenhar() }
    return b
  }))

  if (!filtrados.length) { $('lista').replaceChildren(el('div', 'vazio', 'Nenhum comando encontrado.')); return }

  $('lista').replaceChildren(...cats.filter(k => filtrados.some(c => c.category === k)).map(k => {
    const itens = filtrados.filter(c => c.category === k)
    const sec = el('section')
    const h = el('h2', '', nomeCat(k)); h.append(el('small', '', `${itens.length} comando${itens.length === 1 ? '' : 's'}`))
    const g = el('div', 'grid')
    itens.forEach(c => {
      const b = el('button', 'cmd'); b.type = 'button'
      b.append(el('code', '', prefixo + c.name))
      if (c.desc) b.append(el('span', '', c.desc))
      b.onclick = async () => {
        let m = `Copiado: ${prefixo}${c.name}`
        try { await navigator.clipboard.writeText(prefixo + c.name) } catch { m = 'Não consegui copiar' }
        const t = el('div', 'toast', m); document.body.append(t); setTimeout(() => t.remove(), 1800)
      }
      g.append(b)
    })
    sec.append(h, g)
    return sec
  }))
}

$('busca').oninput = e => { q = norm(e.target.value.trim()); desenhar() }

fetch('comandos.json').then(r => r.json()).then(d => {
  dados = d; $('total').textContent = d.total; desenhar()
}).catch(() => { $('lista').replaceChildren(el('div', 'vazio', 'Não consegui carregar a lista agora. Tente de novo em instantes.')) })
</script>
</body>
</html>
