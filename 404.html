/* Paleta tirada da arte: quarto de madrugada (violeta), luar (lilás claro) e a luz do abajur (âmbar, só em destaques) */
:root{--noite:#0d0919;--painel:#150f27;--painel2:#1d1535;--linha:#2d2350;--luar:#eae4ff;--mudo:#a096be;--violeta:#8f5cf2;--lilas:#c4a8ff;--lampada:#ffb36b;
--disp:"Gabarito","Trebuchet MS",system-ui,sans-serif;--corpo:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;color-scheme:dark}
body{background:var(--noite);color:var(--luar);font:17px/1.6 var(--corpo);padding-bottom:env(safe-area-inset-bottom);
background-image:radial-gradient(900px 500px at 85% -80px,#3b1d7a55,transparent 70%),radial-gradient(700px 400px at -10% 40%,#24104f44,transparent 70%);background-repeat:no-repeat}
::selection{background:var(--violeta);color:#fff}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:0 auto;padding:0 22px}
.mu{color:var(--mudo)}
h1,h2,h3,.preco,.stat b{font-family:var(--disp)}
h1{font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.03em;font-weight:800}

a em{font-style:normal;color:var(--lilas);text-decoration:underline;text-underline-offset:3px}
section{padding:96px 0 0}
.sec-h{display:flex;flex-direction:column;gap:12px;margin-bottom:36px;max-width:620px}
/* controles personalizados: nada com a aparência padrão do navegador */
button,input,summary{appearance:none;-webkit-appearance:none}
.btn,.qk button,.envio input{font:inherit}
header{position:sticky;top:0;z-index:5;background:#0d0919cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top)}

.btn:hover{border-color:var(--lilas)}.btn:active{transform:scale(.97)}
.pri{background:var(--violeta);border-color:var(--violeta);color:#fff;box-shadow:0 6px 28px #8f5cf255}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}


h1{font-size:clamp(34px,6vw,56px)}

.layout>*{grid-column:2}
.topo{padding:60px 0 8px}.topo p{margin-top:12px}
.resumo{position:relative;margin-top:28px;padding:26px 28px;border:1.5px solid var(--violeta);border-radius:24px;background:linear-gradient(160deg,#2a1a52,var(--painel) 70%);box-shadow:0 24px 60px #8f5cf222}

details.toc{grid-column:1;grid-row:1/span 4;align-self:start;position:sticky;top:96px;margin-top:64px;border:0;border-left:1.5px solid var(--linha);padding:0 0 0 20px}
details.toc summary{padding:0 0 12px;font:600 18px var(--disp);display:flex;justify-content:space-between;list-style:none;cursor:pointer}
details.toc summary::after{content:"+";font:400 26px/1 var(--corpo);color:var(--lilas);transition:transform .25s}

.toc ol{list-style:none;padding:0;display:grid;gap:2px}
.toc a{display:block;padding:6px 0;color:var(--mudo);font-size:15px;line-height:1.35;transition:color .15s}
.toc a:hover{color:var(--lilas)}

h2{font-size:clamp(24px,3.6vw,30px);line-height:1.15;margin-bottom:16px}

th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--linha)}
th{background:var(--painel2);color:var(--mudo);font-weight:500;font-size:14px}

@media(min-width:1000px){details.toc summary{pointer-events:none;cursor:default}details.toc summary::after{display:none}}

.menu .btn{margin-top:22px}

body.menu-open .burger span:nth-child(2){opacity:0}

<script>
// no desktop o índice fica aberto ao lado do texto; no celular começa fechado
const toc = document.querySelector('details.toc')
if (toc && !matchMedia('(min-width:1000px)').matches) toc.open = false

// ===== OS OLHOS DO YORU SEGUEM O CURSOR =====
;(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { document.querySelector('body > svg[aria-hidden]')?.pauseAnimations(); return }
  let px = 0, py = 0, raf = 0
  const olhar = () => {
    raf = 0
    document.querySelectorAll('svg.yoru').forEach(s => {
      const r = s.getBoundingClientRect()
      if (r.bottom < 0 || r.top > innerHeight) return
      const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height * .45)
      const d = Math.hypot(dx, dy) || 1, f = Math.min(1, d / 160)
      s.style.setProperty('--yx', (dx / d * 3.4 * f).toFixed(2))
      s.style.setProperty('--yy', (dy / d * 2.2 * f).toFixed(2))
    })
  }
  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; if (!raf) raf = requestAnimationFrame(olhar) }, { passive: true })
})()

// ===== PATINHA: VOLTAR AO TOPO =====
;(() => {
  const p = document.getElementById('subir')
  if (!p) return
  const ver = () => p.classList.toggle('on', scrollY > 600)
  addEventListener('scroll', ver, { passive: true }); ver()
  p.onclick = () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
})()

// ===== MENU LATERAL =====
;(() => {
  const b = document.getElementById('burger'), m = document.getElementById('menu'), s = document.getElementById('scrim'), x = document.getElementById('fechar')
  if (!b || !m) return
  const aberto = () => document.body.classList.contains('menu-open')
  const abrir = () => {
    document.body.classList.add('menu-open'); document.documentElement.style.overflow = 'hidden'
    b.setAttribute('aria-expanded', 'true'); b.setAttribute('aria-label', 'Fechar menu')
    requestAnimationFrame(() => x.focus({ preventScroll: true }))
  }
  const fechar = (voltar = true) => {
    document.body.classList.remove('menu-open'); document.documentElement.style.overflow = ''
    b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', 'Abrir menu')
    if (voltar) b.focus({ preventScroll: true })
  }
  b.onclick = () => aberto() ? fechar() : abrir()
  x.onclick = () => fechar()
  s.onclick = () => fechar()
  m.addEventListener('click', e => { if (e.target.closest('a')) fechar(false) })
  document.addEventListener('keydown', e => {
    if (!aberto()) return
    if (e.key === 'Escape') return fechar()
    if (e.key !== 'Tab') return
    const f = [...m.querySelectorAll('a[href],button')]
    const i = f.indexOf(document.activeElement)
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus() }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus() }
  })
})()
</script>
